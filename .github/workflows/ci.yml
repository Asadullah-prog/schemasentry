# NOTE: third-party actions are pinned to full commit SHAs (version in the
# trailing comment) to guard against tag mutation. To update a pin, resolve
# the new tag to its commit (e.g. `gh api repos/actions/checkout/commits/v4
# --jq .sha`) and update the SHA and the comment together. Dependabot is
# configured for the github-actions ecosystem to propose these updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Run tests
        run: pytest -q
      - name: Build package
        run: python -m build
