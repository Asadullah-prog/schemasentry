[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemasentry"
version = "0.1.0"
description = "Privacy-first, local-first data contract validation for CSV, Excel, and JSON datasets."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SchemaSentry contributors" }]
keywords = ["data-validation", "data-contracts", "csv", "excel", "json", "data-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0", "build>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
schemasentry = "schemasentry.cli:app"

[project.urls]
Homepage = "https://github.com/example/schemasentry"
Documentation = "https://github.com/example/schemasentry#readme"
"Issue Tracker" = "https://github.com/example/schemasentry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/schemasentry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
