name: "SchemaSentry data contract check"
description: "Validate CSV, Excel, and JSON datasets against a YAML data contract. Fails the job on violations; never leaks cell values."


inputs:
  dataset:
    description: "Path to the dataset file, relative to working-directory."
    required: true
  contract:
    description: "Path to the SchemaSentry YAML contract, relative to working-directory."
    required: true
  sheet:
    description: "Excel worksheet name (only used for .xlsx datasets)."
    required: false
    default: ""
  input-format:
    description: "Override dataset format detection: csv, xlsx, json, jsonl."
    required: false
    default: ""
  output-format:
    description: "Report format written to the report file: json or terminal."
    required: false
    default: "json"
  working-directory:
    description: "Directory containing the dataset and contract."
    required: false
    default: "."
  python-version:
    description: "Python version used to run SchemaSentry."
    required: false
    default: "3.12"

outputs:
  outcome:
    description: "'passed', 'failed' (contract violated), or 'error' (bad config/execution)."
    value: ${{ steps.check.outputs.outcome }}
  report-path:
    description: "Path of the written validation report."
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SchemaSentry from the action source
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install from the checked-out action source; no PyPI package required.
        python -m pip install "${{ github.action_path }}"

    - name: Validate dataset against contract
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SS_DATASET: ${{ inputs.dataset }}
        SS_CONTRACT: ${{ inputs.contract }}
        SS_SHEET: ${{ inputs.sheet }}
        SS_INPUT_FORMAT: ${{ inputs.input-format }}
        SS_OUTPUT_FORMAT: ${{ inputs.output-format }}
      run: |
        set -u
        REPORT_PATH="${RUNNER_TEMP}/schemasentry-report.${SS_OUTPUT_FORMAT}"
        ARGS=(check "${SS_DATASET}" --contract "${SS_CONTRACT}" --format "${SS_OUTPUT_FORMAT}" --output "${REPORT_PATH}")
        if [ -n "${SS_SHEET}" ]; then ARGS+=(--sheet "${SS_SHEET}"); fi
        if [ -n "${SS_INPUT_FORMAT}" ]; then ARGS+=(--input-format "${SS_INPUT_FORMAT}"); fi

        set +e
        schemasentry "${ARGS[@]}"
        CODE=$?
        set -e

        # Job summary: counts and rule names only — never dataset contents.
        python - "${REPORT_PATH}" "${CODE}" >> "${GITHUB_STEP_SUMMARY}" <<'PYEOF'
        import json, os, sys

        report_path, code = sys.argv[1], int(sys.argv[2])
        try:
            with open(report_path, encoding="utf-8") as fh:
                report = json.load(fh)
        except (OSError, json.JSONDecodeError):
            report = None

        print("## SchemaSentry data contract check")
        if code == 0:
            outcome = "passed"
            print("**Result:** :white_check_mark: passed")
        elif code == 1:
            outcome = "failed"
            print("**Result:** :x: failed — dataset violates the contract")
        else:
            outcome = "error"
            print(f"**Result:** :warning: error — invalid configuration or execution failure (exit {code})")
        if report:
            print(f"- Checks passed: {report.get('checks_passed', '?')}")
            print(f"- Checks failed: {report.get('checks_failed', '?')}")
            print(f"- Rows: {report.get('row_count', '?')}")
            violations = report.get("violations", [])
            if violations:
                print("\n| Rule | Column | Severity | Count |")
                print("|---|---|---|---|")
                for v in violations:
                    print(f"| {v['rule']} | {v.get('column') or '—'} | {v['severity']} | {v['count']} |")
        else:
            print("_No machine-readable report was produced._")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"outcome={outcome}\n")
            fh.write(f"report-path={report_path}\n")
        PYEOF

        if [ "${CODE}" -eq 1 ]; then
          echo "::error::SchemaSentry: dataset violates the contract (see job summary)."
        elif [ "${CODE}" -ne 0 ]; then
          echo "::error::SchemaSentry: configuration or execution error (exit ${CODE})."
        fi
        exit "${CODE}"

branding:
  icon: "shield"
  color: "green"
